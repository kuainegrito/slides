<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课件中心 · kuaiyu.site/slide</title>
<style>
  :root { --paper:#fdfbf7; --ink:#2b2b33; --ink-soft:#6b6560; --heart:#c2546a; --vein:#3a5a78; --line:rgba(43,43,51,.1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:10vh 6vw 60px; }
  .kicker { font-size:13px; letter-spacing:.45em; color:var(--heart); text-indent:.45em; }
  h1 { font-family:"Noto Serif SC","Songti SC",serif; font-size:clamp(30px,4.5vw,52px); letter-spacing:.1em; margin:14px 0 8px; }
  .sub { color:var(--ink-soft); font-size:14px; margin-bottom:48px; }
  .decks { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; width:min(1000px,94vw); }
  .deck { display:block; text-decoration:none; color:var(--ink); background:#fffdf9; border:1px solid var(--line); border-radius:16px; padding:26px; position:relative; overflow:hidden; transition:transform .2s,box-shadow .2s; }
  .deck::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c,var(--heart)); }
  .deck:hover { transform:translateY(-4px); box-shadow:0 20px 44px -18px rgba(80,40,50,.3); }
  .deck .path { font-size:11px; color:var(--ink-soft); letter-spacing:.08em; }
  .deck h2 { font-size:21px; margin:8px 0 4px; font-family:"Noto Serif SC",serif; }
  .deck .meta { font-size:12.5px; color:var(--ink-soft); margin-top:8px; }
  .deck .badge { display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:99px; padding:2px 10px; margin-top:12px; color:var(--ink-soft); }
  .deck .badge.building { color:var(--heart); border-color:var(--heart); }
  .soon { opacity:.55; }
  footer { margin-top:60px; font-size:11px; color:var(--ink-soft); }
</style>
</head>
<body>
  <div class="kicker">KUAIYU.SITE / SLIDE</div>
  <h1>课 件 中 心</h1>
  <div class="sub">幻灯片的网页版 —— 可翻页、可嵌入互动工具、可持续迭代的活体课件</div>
  <div class="decks">
    <a class="deck" style="--c:#c2546a" href="./physio/cardiovascular/">
      <div class="path">physio / cardiovascular</div>
      <h2>第四章 · 血液循环</h2>
      <div class="meta">《生理学》第10版 · 192 页 · 五节 + 总结复习 · 内嵌 4 个互动模拟器</div>
      <span class="badge building">框架已上线 · 逐节精修中</span>
    </a>
    <div class="deck soon" style="--c:#3a5a78">
      <div class="path">physio / cell</div>
      <h2>第二章 · 细胞的基本功能</h2>
      <div class="meta">规划中 —— 动作电位互动系统原生配套章节</div>
      <span class="badge">待建</span>
    </div>
    <div class="deck soon" style="--c:#4e7a5a">
      <div class="path">physio / …</div>
      <h2>更多章节</h2>
      <div class="meta">呼吸 · 血液 · 消化 · 尿生成 · 神经 · 内分泌…… 按同一流水线转换</div>
      <span class="badge">待建</span>
    </div>
  </div>
  <footer>kuaiyu.site · 生理学互动课件</footer>
</body>
</html>
