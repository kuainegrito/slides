# 单密码课件访问：登录服务仅监听本机，密码与 Cookie 密钥不入库。
location = /_slides_course_auth/check {
    internal;
    proxy_pass http://127.0.0.1:3097/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /slides-course-login/ {
    proxy_pass http://127.0.0.1:3097/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @slides_course_login {
    return 302 /slides-course-login/?next=$uri;
}

location ^~ /slides/其他课件/教学创新大赛讲座总结/ {
    auth_request /_slides_course_auth/check;
    error_page 401 = @slides_course_login;
    alias /var/www/slides/其他课件/教学创新大赛讲座总结/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
